name: lightweight-validation

on:
  push:
  pull_request:

jobs:
  syntax-and-core-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          python -m pip install timm==1.0.15 numpy==2.1.3 Pillow==11.0.0
      - name: Syntax check
        run: python -m compileall -q common module_edge_perception module_scheduling scripts
      - name: Core logic tests
        run: python -m unittest discover -s tests -v
      - name: Reproduction entrypoint dry runs
        run: |
          python scripts/reproduce_modelnet40.py --dry-run
          python scripts/reproduce_boxcars.py --dry-run
          python scripts/reproduce_network.py --dry-run
          python scripts/reproduce_multinode.py --dry-run
